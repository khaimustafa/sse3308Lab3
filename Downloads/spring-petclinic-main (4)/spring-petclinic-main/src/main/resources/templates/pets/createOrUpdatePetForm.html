<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>
    <th:block th:if="${pet['new']}" th:text="#{new}">New </th:block>
    <span th:text="#{pet}">Pet</span>
  </h2>

  /**Error Message**/
  <div th:if="${#fields.hasErrors()}" class="alert alert-danger">
    <p><strong>Please correct the following errors:</strong></p>
    <ul>
      <li th:each="err : ${#fields.errors('*')}" 
      th:text="${err}">Error message</li>
    </ul>
  </div>

  <form th:object="${pet}" class="form-horizontal" method="post">
    <input type="hidden" name="id" th:value="*{id}" />
    <div class="form-group has-feedback">
      <div class="form-group">
        <label class="col-sm-2 control-label" th:text="#{owner}">Owner</label>
        <div class="col-sm-10">
          <span th:text="${owner?.firstName + ' ' + owner?.lastName}" />
        </div>
      </div>

      /**Updated pet fields**/
      <input th:replace="~{fragments/inputField :: input ('Name', 'name', 'text')}" />
      <div th:if="${#fields.hasErrors('name')}" class="text-danger" th:errors="*{name}"></div>

      <input th:replace="~{fragments/inputField :: input ('Birth Date', 'birthDate', 'date')}" />
      <div th:if="${#fields.hasErrors('birthDate')}" class="text-danger" th:errors="*{birthDate}"></div>

      <input th:replace="~{fragments/selectField :: select ('Type', 'type', ${types})}" />
      <div th:if="${#fields.hasErrors('type')}" class="text-danger" th:errors="*{type}"></div>

      <!-- Optional: if you added weight field (CR-5) -->
      <input th:replace="~{fragments/inputField :: input ('Weight (kg)', 'weight', 'number')}" />
      <div th:if="${#fields.hasErrors('weight')}" class="text-danger" th:errors="*{weight}"></div>


    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button th:with="text=${pet['new']} ? 'Add Pet' : 'Update Pet'" class="btn btn-primary" type="submit"
          th:text="${text}">Add Pet</button>
      </div>
    </div>
  </form>

</body>

</html>
